[package]
name = "simq"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "High-performance quantum computing SDK in Rust"

[dependencies]
simq-core.workspace = true
simq-state.workspace = true
simq-gates.workspace = true
simq-compiler.workspace = true
simq-sim.workspace = true
simq-backend.workspace = true
rand.workspace = true
mimalloc = { version = "0.1", optional = true }

[features]
# Swaps the process global allocator to mimalloc
mimalloc = ["dep:mimalloc"]

# Simulator features
gpu = ["simq-sim/gpu"]
vqe = ["simq-sim/vqe"]

# Backend features
local-simulator = ["simq-backend/local-simulator"]
ibm-quantum = ["simq-backend/ibm-quantum"]
async = ["simq-backend/async"]

# Core features
serde = ["simq-core/serde"]
serialization = ["simq-core/serialization"]
cache = ["simq-core/cache"]

[dev-dependencies]
approx.workspace = true
criterion.workspace = true

[[bench]]
name = "end_to_end"
harness = false
