[package]
name = "simq"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "High-performance quantum computing SDK in Rust"

[dependencies]
simq-core.workspace = true
simq-state.workspace = true
simq-gates.workspace = true
simq-compiler.workspace = true
simq-sim.workspace = true
simq-backend.workspace = true
rand.workspace = true
mimalloc = { version = "0.1", optional = true }

[features]
# Swaps the process global allocator to mimalloc -- see the
# `#[global_allocator]` note in src/lib.rs for why this is opt-in rather
# than a default: it's a process-wide choice a library shouldn't impose on
# downstream binaries that link it. Off by default; benchmarks enable it
# explicitly to measure the effect (see BENCHMARKS.md).
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
approx.workspace = true
criterion.workspace = true

[[bench]]
name = "end_to_end"
harness = false
