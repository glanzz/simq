[package]
name = "simq-state"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Quantum state representations for SimQ"

[dependencies]
simq-core.workspace = true
num-complex.workspace = true
# Sparse state uses `foldhash::fast::RandomState` for its u64-keyed amplitude
# map (measurably faster than ahash here; see sparse_state.rs). No `ahash`
# or `sprs` dependency needed by design.
foldhash.workspace = true
rayon.workspace = true
thiserror.workspace = true
rand.workspace = true

[dev-dependencies]
approx.workspace = true
criterion.workspace = true
proptest.workspace = true
simq-gates.workspace = true

